{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}El Sabueso Feliz{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Menú lateral -->
    {% include "navbar.html" %}

    <!-- Contenido principal -->
    <div class="contenido">

        <!-- Barra superior -->
        <header class="d-flex align-items-center gap-3 px-3 py-3 bg-white border-bottom">

            <button class="btn btn-outline-secondary d-lg-none"
                    type="button"
                    data-menu="alternar">
                <i class="bi bi-list"></i>
            </button>

            <input type="search"
                   class="form-control buscador"
                   placeholder="Buscar perro, dueño o historia...">

            <span class="ms-auto d-none d-md-inline">
                Sucursal: Centro
            </span>

            <span class="fw-bold">
                Administración
            </span>

        </header>

        <!-- Contenido de cada página -->
        <main class="p-3 p-lg-4">
            {% block content %}{% endblock %}
        </main>

    </div>

    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio -->
    <script src="{% static 'js/menu.js' %}"></script>

    {% block js %}{% endblock %}

</body>

</html>
