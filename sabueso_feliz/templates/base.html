{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}El Sabueso Feliz{% endblock %}
    </title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Estilos propios -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Menú lateral -->
    {% block navbar %}
        {% include 'navbar.html' %}
    {% endblock %}

    <!-- Todo lo que está a la derecha del menú -->
    <div class="contenido">

        <!-- Barra superior -->
        {% block topbar %}
        <header class="d-flex align-items-center gap-3 px-3 px-lg-4 py-3 bg-white border-bottom">

            <!-- Botón para abrir el menú en celulares -->
            <button
                class="btn btn-outline-secondary d-lg-none"
                type="button"
                data-menu="alternar"
                aria-label="Abrir menú"
            >
                <i class="bi bi-list"></i>
            </button>

            <input
                type="search"
                class="form-control buscador"
                placeholder="Buscar perro, dueño o historia..."
            >

            <span class="ms-auto d-none d-md-inline border rounded px-3 py-1 fw-bold small">
                Sucursal: Centro
            </span>

            <span class="d-flex align-items-center gap-2 fw-bold">
                <span class="avatar">AD</span>
                <span class="d-none d-sm-inline">Administración</span>
            </span>

        </header>
        {% endblock %}

        <!-- Contenido de cada página -->
        <main class="p-3 p-lg-4">
            {% block content %}{% endblock %}
        </main>

    </div>

    <!-- JavaScript de Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    {% block js %}{% endblock %}

</body>
</html>
