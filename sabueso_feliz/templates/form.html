{% extends 'base.html' %}

{% block content %}
<div class="tarjeta p-4">
    <h1>
        {% if object %}Editar{% else %}Nuevo registro{% endif %}
    </h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-sabueso">
            Guardar
        </button>
    </form>
</div>
{% endblock %}
